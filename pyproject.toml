[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F401", "F841", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["^alembic/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true  # Forces you to write type hints for functions

[tool.pytest.ini_options]
pythonpath = ["."]
