# turing_service infrastructure — dedicated Postgres for turing's own records
# (batches, calls, transcripts, request logs).
#
# Host port 5433 (kalam-postgres uses 5432; docstribe-infra uses 5434).
#
#   docker compose up -d postgres
#   alembic upgrade head        # apply turing's schema

services:
  postgres:
    # pgvector build of Postgres 17 — the sql_agent control plane (sql_agent_db,
    # a sibling database on this server) needs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg17
    container_name: turing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TURING_PG_USER:-turing}
      POSTGRES_PASSWORD: ${TURING_PG_PASSWORD:-turing}
      POSTGRES_DB: ${TURING_PG_DB:-turing_db}
    ports:
      - "${TURING_PG_PORT:-5433}:5432"
    volumes:
      - turing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TURING_PG_USER:-turing} -d ${TURING_PG_DB:-turing_db}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: turing-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - "${TURING_REDIS_PASSWORD:-turing}"
    ports:
      - "${TURING_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TURING_REDIS_PASSWORD:-turing}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  turing-postgres-data:
